version: '3.8'

services:
  vd-frontend:
    build:
      context: ./vd-frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_HOST=${VITE_API_HOST}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - vd-backend

  vd-backend:
    build:
      context: ./vd-backend
      dockerfile: Dockerfile.prod
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - vd-db

  vd-db:
    image: postgres:latest
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: