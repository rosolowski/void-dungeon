services:
  vd-frontend:
    build:
      context: ./vd-frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    depends_on:
      - vd-backend
    restart: unless-stopped

  vd-backend:
    build:
      context: ./vd-backend
      dockerfile: Dockerfile
    expose:
      - "3000"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
    depends_on:
      - vd-db
    restart: unless-stopped

  vd-db:
    image: postgres:latest
    env_file:
      - .env.prod
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - vd-frontend
      - vd-backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email your-email@example.com --agree-tos --no-eff-email -d vdgame.pl

volumes:
  postgres_data: